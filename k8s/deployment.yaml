apiVersion: apps/v1
kind: Deployment

metadata:
  name: sneaker-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: sneaker

  template:
    metadata:
      labels:
        app: sneaker

    spec:
      containers:

      - name: sneaker-container

        image: sneaker-app:latest

        imagePullPolicy: Never

        ports:
        - containerPort: 80
